<div class="row">
    <div class="col-12 d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Usuarios</h2>
        <button class="btn btn-primary" (click)="openCreateModal()">
            <i class="fas fa-user-plus mr-2"></i>Nuevo Usuario
        </button>
    </div>
</div>

<!-- Filter Section -->
<div class="card mb-3 shadow-sm">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Buscar por Nombre o Email</label>
                <input type="text" 
                       class="form-control" 
                       [(ngModel)]="searchTerm" 
                       (input)="filterUsers()"
                       placeholder="Escribe para filtrar...">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Filtrar por Rol</label>
                <select class="form-select" [(ngModel)]="roleFilter" (change)="filterUsers()">
                    <option value="">Todos los roles</option>
                    <option value="ADMIN">Admin</option>
                    <option value="VENDEDOR">Vendedor</option>
                    <option value="RECEPCION">Recepción</option>
                    <option value="USER">Usuario</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-secondary w-100" (click)="clearFilters()">
                    <i class="fas fa-times me-1"></i>Limpiar
                </button>
            </div>
        </div>
    </div>
</div>

<div class="card shadow">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="bg-light">
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th class="text-right">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of filteredUsers">
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <span class="badge" [ngClass]="{
                            'bg-danger text-white': user.role === 'ADMIN',
                            'bg-info text-dark': user.role !== 'ADMIN'
                          }">
                            {{ user.role }}
                        </span>
                    </td>
                    <td class="text-right">
                        <button class="btn btn-sm btn-outline-info mr-2" (click)="openEditModal(user)">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" (click)="deleteUser(user.id)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" [ngClass]="{'show d-block': showModal}" tabindex="-1" *ngIf="showModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ isEditing ? 'Editar Usuario' : 'Nuevo Usuario' }}</h5>
                <button type="button" class="close" (click)="closeModal()">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" [(ngModel)]="currentUser.username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" [(ngModel)]="currentUser.email">
                </div>
                <div class="form-group">
                    <label>Password {{ isEditing ? '(vacío para mantener)' : '' }}</label>
                    <input type="password" class="form-control" [(ngModel)]="currentUser.password">
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select class="form-control" [(ngModel)]="currentUser.role">
                        <option value="">Seleccionar rol...</option>
                        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" (click)="saveUser()">Guardar</button>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop fade show" *ngIf="showModal"></div>
